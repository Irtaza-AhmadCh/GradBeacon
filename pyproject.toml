# Runtime dependencies mirror requirements.txt (hosts like Vercel install from this table). Keep both in sync.
[project]
name = "gradbeacon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "starlette==1.8.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "tavily-python==0.8.5",
    "trafilatura==2.3.1",
    "lxml==6.1.3",
    "rank-bm25==0.2.2",
    "numpy==2.5.4",
    "sse-starlette==3.5.0",
    "tldextract==5.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "B904", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
